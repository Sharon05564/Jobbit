version: "3.9"

services:
  # ── PostgreSQL database ──────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: jobbit
      POSTGRES_PASSWORD: jobbit
      POSTGRES_DB: jobbit
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobbit"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── API server ───────────────────────────────────────────────────────────
  api:
    build: .
    command: jobbit api
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://jobbit:jobbit@postgres:5432/jobbit
      HOST: 0.0.0.0
      PORT: 3000
      DB_POOL_SIZE: 5
      RUST_LOG: info
    depends_on:
      postgres:
        condition: service_healthy

  # ── Background worker ────────────────────────────────────────────────────
  worker:
    build: .
    command: jobbit worker
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://jobbit:jobbit@postgres:5432/jobbit
      WORKER_POLL_INTERVAL_MS: 2000
      DB_POOL_SIZE: 3
      RUST_LOG: info
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
